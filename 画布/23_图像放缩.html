<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <script>
        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)


            ctx.translate(200, 200)
            ctx.scale(2, 1);
            // 绘制坐标系
            ctx.beginPath()
            ctx.moveTo(-400, 0)
            ctx.lineTo(400, 0)
            ctx.stroke()

            ctx.moveTo(0, -400)
            ctx.lineTo(0, 400)
            ctx.stroke()

            for (let i = -400; i < 400; i += 10) {
                ctx.beginPath()
                ctx.moveTo(i, -5)
                ctx.lineTo(i, 5)
                ctx.stroke()

                ctx.beginPath()
                ctx.moveTo(-5, i)
                ctx.lineTo(5, i)
                ctx.stroke()
            }


            ctx.rect(0, 0, 50, 20)
            ctx.fill()

        })();

        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)


            ctx.translate(200, 200)
            ctx.scale(1, -1);
            // 绘制坐标系
            ctx.beginPath()
            ctx.moveTo(-400, 0)
            ctx.lineTo(400, 0)
            ctx.stroke()

            ctx.moveTo(0, -400)
            ctx.lineTo(0, 400)
            ctx.stroke()

            for (let i = -400; i < 400; i += 10) {
                ctx.beginPath()
                ctx.moveTo(i, -5)
                ctx.lineTo(i, 5)
                ctx.stroke()

                ctx.beginPath()
                ctx.moveTo(-5, i)
                ctx.lineTo(5, i)
                ctx.stroke()
            }


            ctx.rect(0, 0, 50, 20)
            ctx.fill()

        })();
    </script>
</body>

</html>
