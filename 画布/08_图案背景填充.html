<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <script>
        let bgCanvas
        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 50
            canvas.height = 50
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            ctx.setLineDash([10, 5, 10, 5])
            ctx.moveTo(0, 25)
            ctx.lineTo(25, 0)
            ctx.lineTo(50, 25)
            ctx.lineTo(25, 50)
            ctx.closePath()
            ctx.stroke()

            ctx.beginPath()
            ctx.setLineDash([1, 2, 1, 2, 1, 2, 1])
            ctx.moveTo(23, 25)
            ctx.lineTo(27, 25)
            ctx.stroke()

            ctx.beginPath()
            ctx.setLineDash([1, 2, 1, 2, 1, 2, 1])
            ctx.moveTo(25, 23)
            ctx.lineTo(25, 27)
            ctx.stroke()

            bgCanvas = canvas
        })();

        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            // 创建图案
            const pattern = ctx.createPattern(bgCanvas, '')

            // 图案填充
            ctx.fillStyle = pattern
            ctx.rect(100, 100, 200, 200)
            ctx.stroke()
            ctx.fill()
        })();

        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            // 图片作为填充图案
            const img = new Image()
            img.src = "../images/04.png"

            img.onload = function () {
                // 创建图案
                const pattern = ctx.createPattern(img, 'repeat')
                
                // 图案填充
                ctx.fillStyle = pattern
                ctx.rect(0, 0, 400, 400)
                ctx.stroke()
                ctx.fill()
            }

        })();


    </script>
</body>

</html>
