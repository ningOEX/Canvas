<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <script>
        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            ctx.transform(1, 0, 0, 1, 100, 100)

            // 绘制坐标系
            {
                ctx.beginPath()
                ctx.moveTo(-400, 0)
                ctx.lineTo(400, 0)
                ctx.stroke()

                ctx.moveTo(0, -400)
                ctx.lineTo(0, 400)
                ctx.stroke()

                for (let i = -400; i < 400; i += 10) {
                    ctx.beginPath()
                    ctx.moveTo(i, -5)
                    ctx.lineTo(i, 5)
                    ctx.stroke()

                    ctx.beginPath()
                    ctx.moveTo(-5, i)
                    ctx.lineTo(5, i)
                    ctx.stroke()
                }
            }
        })();
        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            ctx.transform(1, 0, 0, 2, 0, 0)

            // 绘制坐标系
            {
                ctx.beginPath()
                ctx.moveTo(-400, 0)
                ctx.lineTo(400, 0)
                ctx.stroke()

                ctx.moveTo(0, -400)
                ctx.lineTo(0, 400)
                ctx.stroke()

                for (let i = -400; i < 400; i += 10) {
                    ctx.beginPath()
                    ctx.moveTo(i, -5)
                    ctx.lineTo(i, 5)
                    ctx.stroke()

                    ctx.beginPath()
                    ctx.moveTo(-5, i)
                    ctx.lineTo(5, i)
                    ctx.stroke()
                }
            }
        })();


        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)
            ctx.beginPath()
            ctx.strokeStyle = "#ccc"
            ctx.rect(20, 20, 200, 100)
            ctx.stroke()
            // 绘制坐标系
            {
                ctx.beginPath()
                ctx.strokeStyle = "#000"
                ctx.moveTo(-400, 0)
                ctx.lineTo(400, 0)
                ctx.stroke()

                ctx.moveTo(0, -400)
                ctx.lineTo(0, 400)
                ctx.stroke()

                for (let i = -400; i < 400; i += 10) {
                    ctx.beginPath()
                    ctx.moveTo(i, -5)
                    ctx.lineTo(i, 5)
                    ctx.stroke()

                    ctx.beginPath()
                    ctx.moveTo(-5, i)
                    ctx.lineTo(5, i)
                    ctx.stroke()
                }
            }

            ctx.transform(1, 0, .5, 1, 20, 20)
            ctx.beginPath()
            ctx.strokeStyle = "red"
            ctx.rect(0, 0, 200, 100)
            ctx.stroke()

        })();

        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            // 旋转45°
            ctx.transform(0.7071, 0.7071, -0.7071, 0.7071, 0, 0)
            // 绘制坐标系
            {
                ctx.beginPath()
                ctx.strokeStyle = "#000"
                ctx.moveTo(-400, 0)
                ctx.lineTo(400, 0)
                ctx.stroke()

                ctx.moveTo(0, -400)
                ctx.lineTo(0, 400)
                ctx.stroke()

                for (let i = -400; i < 400; i += 10) {
                    ctx.beginPath()
                    ctx.moveTo(i, -5)
                    ctx.lineTo(i, 5)
                    ctx.stroke()

                    ctx.beginPath()
                    ctx.moveTo(-5, i)
                    ctx.lineTo(5, i)
                    ctx.stroke()
                }
            }
        })();

        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            // 旋转 30°
            // ctx.transform(0.866, 0.5, -0.5, 0.866, 0, 0)
            const deg = 45
            ctx.transform(Math.cos(deg * Math.PI / 180), Math.sin(deg * Math.PI / 180), -Math.sin(deg * Math.PI / 180), Math.cos(deg * Math.PI / 180), 200, 200)
            // 绘制坐标系
            {
                ctx.beginPath()
                ctx.strokeStyle = "#000"
                ctx.moveTo(-400, 0)
                ctx.lineTo(400, 0)
                ctx.stroke()

                ctx.moveTo(0, -400)
                ctx.lineTo(0, 400)
                ctx.stroke()

                for (let i = -400; i < 400; i += 10) {
                    ctx.beginPath()
                    ctx.moveTo(i, -5)
                    ctx.lineTo(i, 5)
                    ctx.stroke()

                    ctx.beginPath()
                    ctx.moveTo(-5, i)
                    ctx.lineTo(5, i)
                    ctx.stroke()
                }
            }
        })();

        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            // 旋转 30°
            ctx.translate(200,200)
            ctx.rotate(90 * Math.PI / 180)
            // 绘制坐标系
            {
                ctx.beginPath()
                ctx.strokeStyle = "#000"
                ctx.moveTo(-400, 0)
                ctx.lineTo(400, 0)
                ctx.stroke()

                ctx.moveTo(0, -400)
                ctx.lineTo(0, 400)
                ctx.stroke()

                for (let i = -400; i < 400; i += 10) {
                    ctx.beginPath()
                    ctx.moveTo(i, -5)
                    ctx.lineTo(i, 5)
                    ctx.stroke()

                    ctx.beginPath()
                    ctx.moveTo(-5, i)
                    ctx.lineTo(5, i)
                    ctx.stroke()
                }
            }
        })();

    </script>
</body>

</html>
