<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        canvas {
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <script>
        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 400
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            const img = new Image()
            img.src = "../images/01.jpeg"
            img.onload = function () {
                ctx.drawImage(img, 0, 90, 400, 220)
            }
        })();
        (() => {
            const canvas = document.createElement('canvas')
            canvas.width = 400
            canvas.height = 540
            const ctx = canvas.getContext('2d')
            document.body.append(canvas)

            const loadImage = (src) =>
                new Promise((resolve, reject) => {
                    const img = new Image()
                    img.onload = () => resolve(img)
                    img.onerror = reject
                    img.src = src
                })

            Promise.all([
                loadImage("../images/02.jpeg"),
                loadImage("../images/03.jpeg"),
            ]).then(([img, img2]) => {
                ctx.drawImage(img, 0, 0, 400, 220)
                ctx.drawImage(img2, 0, 320, 400, 220)
            }).catch(err => console.error("图片加载失败:", err))


            ctx.beginPath()
            ctx.textAlign="center"
            ctx.textBaseline="middle"
            ctx.font="bold italic 50px serif"
            ctx.strokeText('金玉风露',200,270)
        })();

    </script>
</body>

</html>
